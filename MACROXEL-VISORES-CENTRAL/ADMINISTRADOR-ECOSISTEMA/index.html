<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Macroxel · Administrador del Ecosistema</title>
<style>html,body{margin:0;width:100%;height:100%;background:#03142b}#mxLoader{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font:600 14px system-ui;text-align:center;padding:24px}</style></head>
<body><div id="mxLoader">Conectando con Macroxel Hospital…</div>
<script>
(async()=>{try{
 const parts=["mx-runtime-v1212/part-01.txt","mx-runtime-v1212/part-02.txt","mx-runtime-v1212/part-03.txt","mx-runtime-v1212/part-04.txt","mx-runtime-v1212/part-05.txt","mx-runtime-v1212/part-06.txt","mx-runtime-v1212/part-07.txt","mx-runtime-v1212/part-08.txt","mx-runtime-v1212/part-09.txt","mx-runtime-v1212/part-10.txt","mx-runtime-v1212/part-11.txt","mx-runtime-v1212/part-12.txt","mx-runtime-v1212/part-13.txt","mx-runtime-v1212/part-14.txt","mx-runtime-v1212/part-15.txt"];
 const text=(await Promise.all(parts.map(async p=>{const r=await fetch(p+'?v=1212&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}))).join('');
 if(!/<html(?:\s|>)/i.test(text))throw new Error('Contenido inválido');
 document.open();document.write(text);document.close();
}catch(e){const x=document.getElementById('mxLoader');if(x)x.innerHTML='No se pudo cargar Administrador del Ecosistema.<br><small style="opacity:.75">Vuelve a abrir el visor desde el Sistema Principal.</small>';console.error(e)}})();
</script></body></html>
