name: Control Central ABX v285 confirmacion y recarga
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/control-central-abx-v285.yml'
      - 'tools/v285_control_central_refresh.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corregir semaforo y recarga de antibioticos
        run: python3 tools/v285_control_central_refresh.py
      - name: Verificar sintaxis del modulo Central
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('MACROXEL-VISORES-CENTRAL/CONTROL-CENTRAL/index.html').read_text(encoding='utf-8')
          a=s.index('/* ===== MACROXEL CANONICAL SOURCE: mx-transfer-antibiotic-capacity-v205 ===== */')
          b=s.index('</script>',a)
          Path('/tmp/abx-check.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/abx-check.js
      - name: Publicar Control Central
        run: |
          if git diff --quiet -- MACROXEL-VISORES-CENTRAL/CONTROL-CENTRAL/index.html; then echo 'Ya publicado'; exit 0; fi
          git config user.name 'Sistemas Macroxel'
          git config user.email 'sistemasmacroxel@gmail.com'
          git add MACROXEL-VISORES-CENTRAL/CONTROL-CENTRAL/index.html
          git commit -m 'Actualiza semaforo de antibioticos y recarga v285'
          git push origin HEAD:main
