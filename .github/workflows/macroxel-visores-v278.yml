name: Publicar visores Macroxel v278
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macroxel-visores-v278.yml'
      - 'tools/v278/control-central.br.b64'
      - 'tools/v278/farmacia-ajusco.br.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar-visores-v278:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar archivos completos y verificar su integridad
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const crypto = require('crypto');
          const targets = [
            {
              source: 'tools/v278/control-central.br.b64',
              target: 'MACROXEL-VISORES-CENTRAL/CONTROL-CENTRAL/index.html',
              sha256: '773ef940f9fc79b1cdaafac989a82dd6bdaf79626418483dbc81ddfbdd4bf3d1'
            },
            {
              source: 'tools/v278/farmacia-ajusco.br.b64',
              target: 'MACROXEL-VISORES-CENTRAL/FARMACIA-AJUSCO-M/index.html',
              sha256: 'cf5ab2caee8a5228ad253d8d9dde5715eccd1c69306688695314fe4d9c8c0d54'
            }
          ];
          for (const file of targets) {
            const input = fs.readFileSync(file.source, 'utf8').replace(/\s/g, '');
            const bytes = zlib.brotliDecompressSync(Buffer.from(input, 'base64'));
            const sum = crypto.createHash('sha256').update(bytes).digest('hex');
            if (sum !== file.sha256) throw Error('Integridad invalida: ' + file.target);
            fs.writeFileSync(file.target, bytes);
            console.log('Visor verificado: ' + file.target + ' (' + bytes.length + ' bytes)');
          }
          NODE
      - name: Publicar solo los dos visores modificados
        shell: bash
        run: |
          if git diff --quiet -- MACROXEL-VISORES-CENTRAL/CONTROL-CENTRAL/index.html MACROXEL-VISORES-CENTRAL/FARMACIA-AJUSCO-M/index.html; then
            echo 'Ambos visores ya estan en v278.'
            exit 0
          fi
          git config user.name 'Sistemas Macroxel - Sync Visores'
          git config user.email 'sistemasmacroxel@gmail.com'
          git add -- MACROXEL-VISORES-CENTRAL/CONTROL-CENTRAL/index.html MACROXEL-VISORES-CENTRAL/FARMACIA-AJUSCO-M/index.html
          git commit -m 'Publica visores v278: eliminar existencias obsoletas y validar sincronizacion'
          git push origin HEAD:main
